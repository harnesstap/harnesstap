[[layers.resources]]
content = "# Demo API service\n\n## Tech Stack\n- Python 3.12+ with type hints on all functions\n- Demo API 0.110+\n- SQLAlchemy 2.0 (async)\n- Pydantic v2 for validation\n- Alembic for migrations\n- pytest with httpx for testing\n- ruff for linting and formatting\n- uv as package manager\n\n## Commands\n- `uv run fastapi dev` — Start dev server\n- `uv run pytest` — Run tests\n- `uv run alembic upgrade head` — Apply migrations\n- `uv run ruff check .` — Lint\n- `uv run ruff format .` — Format\n- `uv run mypy .` — Type check\n\n## Architecture\n- `app/api/` — Route handlers\n- `app/models/` — SQLAlchemy models\n- `app/schemas/` — Pydantic schemas\n- `app/core/` — Configuration and utilities\n- `app/services/` — Business logic\n- `tests/` — Mirrors app/ structure\n\n## Conventions\n- Type hints required on all functions\n- Google style docstrings\n- Async endpoints by default (async def)\n- Dependency injection via Demo API Depends()\n- Line length: 88 characters (ruff default)\n- Class names: PascalCase, functions/variables: snake_case\n\n## Rules\n- Watch for GPU memory leaks: call torch.cuda.empty_cache() after inference\n- Never commit model weight files (.pt, .pth) to git\n- All SQL queries use SQLAlchemy, no raw SQL\n- Every endpoint needs integration tests"
description = "Core project context for Demo API applications"
name = "project-context"
type = "instruction"

[[layers.resources]]
content = "# API Design Rules\n\n- Every handler follows: validate -> execute -> respond\n- Specify response_model on every endpoint\n- Use zod/pydantic schemas colocated with the handler\n- HTTP status codes: 200 (success), 201 (created), 400 (validation), 401 (auth), 404 (not found), 500 (server error)\n- Pagination uses cursor-based approach with { cursor, limit } params\n- Include OpenAPI documentation comments on all endpoints"
description = "API endpoint design patterns"
name = "api-design"
type = "rule"

[layers.resources.metadata]
always_apply = false
globs = [ "app/api/**/*.py" ]

