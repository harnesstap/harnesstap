[package]
name = "models-rs"
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
publish = false
description = "The port of src/models: rows of the HarnessTap database, on db-rs"

[dependencies]
db-rs = { path = "../db-rs" }
emit-rs = { path = "../emit-rs" }
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip", "unbounded_depth"] }
ulid = "1"
sha2 = "0.10"

[dev-dependencies]
regex = "1"
ulid = "1"

[lints.clippy]
all = { level = "warn", priority = -1 }
