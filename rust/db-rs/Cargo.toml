[package]
name = "db-rs"
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
publish = false
description = "The port of src/db: the SQLite connection, schema migrations and status write tracking (ADR-012)"

[dependencies]
emit-rs = { path = "../emit-rs" }
plugin-semver-rs = { path = "../plugin-semver-rs" }
regex = "1"
rusqlite = { version = "0.37", features = ["bundled"] }
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip", "unbounded_depth"] }

[lints.clippy]
all = { level = "warn", priority = -1 }
