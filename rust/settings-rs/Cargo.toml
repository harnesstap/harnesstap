[package]
name = "settings-rs"
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
publish = false
description = "The port of src/config/settings.ts and src/services/plugin-resource-mode.ts"

[dependencies]
emit-rs = { path = "../emit-rs" }
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip", "unbounded_depth"] }

[lints.clippy]
all = { level = "warn", priority = -1 }
