[package]
name = "picomatch-rs"
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
publish = false
description = "picomatch 4 as HarnessTap calls it: `picomatch(pattern, { dot: true })` on POSIX"

[dependencies]
fancy-regex = "0.20"

[dev-dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lints.clippy]
all = { level = "warn", priority = -1 }
