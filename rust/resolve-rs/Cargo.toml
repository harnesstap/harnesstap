[package]
name = "resolve-rs"
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
publish = false
description = "Rust port of the version side of `src/services/resolve`: constraints, mediation and their errors"

[dependencies]
node-semver-rs = { path = "../node-semver-rs" }
regex = "1"
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
serde_json = "1"

[lints.clippy]
all = { level = "warn", priority = -1 }
