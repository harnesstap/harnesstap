[package]
name = "resolve-rs"
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
publish = false
description = "Rust port of `src/services/resolve`: constraints, mediation, their errors, and the resolution types"

[dependencies]
emit-rs = { path = "../emit-rs" }
models-rs = { path = "../models-rs" }
node-semver-rs = { path = "../node-semver-rs" }
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip"] }
sha2 = "0.10"

[dev-dependencies]

[lints.clippy]
all = { level = "warn", priority = -1 }
