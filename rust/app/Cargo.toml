[package]
name = "ht"
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
publish = false
description = "Front door for `ht`, generated by rust-anything: Rust owns the entry point, the original answers what is not ported yet"
build = "build.rs"

[[bin]]
name = "ht"
path = "src/main.rs"

[dependencies]
clap = "4"
serde_json = "1"
version-rs = { path = "../version-rs" }
cli-rs = { path = "../cli-rs" }
db-rs = { path = "../db-rs" }
models-rs = { path = "../models-rs" }
plugin-model-rs = { path = "../plugin-model-rs" }

[build-dependencies]
version-rs = { path = "../version-rs" }

[workspace]
