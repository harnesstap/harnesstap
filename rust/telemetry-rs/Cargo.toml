[package]
name = "telemetry-rs"
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
publish = false
description = "The port of the CLI telemetry prologue in src/telemetry: the notice, consent rules, state file and startup events"

[dependencies]
emit-rs = { path = "../emit-rs" }
settings-rs = { path = "../settings-rs" }
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip", "unbounded_depth"] }

[lints.clippy]
all = { level = "warn", priority = -1 }
