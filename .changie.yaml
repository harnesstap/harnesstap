changesDir: .changes
unreleasedDir: unreleased
headerPath: header.tpl.md
versionHeaderPath: ""
changelogPath: CHANGELOG.md
versionExt: md
envPrefix: "CHANGIE_"
versionFormat: '## harnessdeck {{.Version}} - {{.Time.Format "January 02, 2006"}}'
kindFormat: '### {{.Kind}}'
changeFormat: |-
  {{- $IssueList := list }}
  {{- if $.Custom.Issue }}
    {{- $changes := splitList " " (printf "%s" $.Custom.Issue) }}
    {{- if ne (len $changes) 0 }}
      {{- range $issueNbr := $changes }}
        {{- $changeLink := "[#nbr](https://github.com/harnessdeck/harnessdeck/issues/nbr)" | replace "nbr" $issueNbr }}
        {{- $IssueList = append $IssueList $changeLink }}
      {{- end }}
    - {{.Body}} ({{ range $index, $element := $IssueList }}{{if $index}}, {{end}}{{$element}}{{end}})
    {{- else }}
    - {{.Body}}
    {{- end }}
  {{- else }}
    - {{.Body}}
  {{- end }}

kinds:
  - label: Breaking Changes
    auto: major
  - label: Features
    auto: minor
  - label: Fixes
    auto: patch
  - label: Docs
    auto: patch
  - label: Dependencies
    auto: patch

newlines:
  afterChangelogHeader: 1
  afterKind: 1
  afterChangelogVersion: 1
  beforeKind: 1
  endOfVersion: 1

custom:
  - key: Issue
    label: GitHub Issue Number (optional, separated by a single space if multiple)
    type: string
    minLength: 0
