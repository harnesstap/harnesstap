<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="980" viewBox="0 0 1600 980" role="img" aria-labelledby="title" aria-describedby="desc">
  <title id="title">HarnessTap feature map</title>
  <desc id="desc">HarnessTap CLI and Desktop share one local library. Scan harness files into canonical SQLite resources, compose plugins and profiles, apply with environment cascade, then use Cloud catalogs or migrate the library across machines. Targets include Claude Code, Cursor, Codex, Copilot, Goose, Grok Build, and 30+ more CLIs.</desc>
  <defs>
    <radialGradient id="bg" cx="50%" cy="22%" r="88%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="52%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </radialGradient>
    <linearGradient id="panel" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.96"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.94"/>
    </linearGradient>
    <linearGradient id="card" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.98"/>
      <stop offset="100%" stop-color="#0b1220" stop-opacity="0.96"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" x2="1">
      <stop offset="0%" stop-color="#14B8A6"/>
      <stop offset="50%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M 48 0 L 0 0 0 48" fill="none" stroke="#94a3b8" stroke-opacity="0.08" stroke-width="1"/>
    </pattern>
    <style>
      .subtitle { fill: #cbd5e1; font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 22px; font-weight: 600; }
      .sectionTitle { fill: #f8fafc; font-family: ui-sans-serif, system-ui, sans-serif; font-size: 26px; font-weight: 750; }
      .sectionCopy { fill: #94a3b8; font-family: ui-sans-serif, system-ui, sans-serif; font-size: 16px; font-weight: 500; }
      .chipText { fill: #f1f5f9; font-family: ui-sans-serif, system-ui, sans-serif; font-size: 16px; font-weight: 700; text-anchor: middle; }
      .hubTitle { fill: #ffffff; font-family: ui-sans-serif, system-ui, sans-serif; font-size: 32px; font-weight: 750; letter-spacing: -0.6px; }
      .hubCopy { fill: #cbd5e1; font-family: ui-sans-serif, system-ui, sans-serif; font-size: 17px; font-weight: 550; }
      .label { fill: #f8fafc; font-family: ui-sans-serif, system-ui, sans-serif; font-size: 22px; font-weight: 750; }
      .small { fill: #94a3b8; font-family: ui-sans-serif, system-ui, sans-serif; font-size: 16px; font-weight: 500; }
      .tiny { fill: #cbd5e1; font-family: ui-sans-serif, system-ui, sans-serif; font-size: 15px; font-weight: 600; }
      .card { fill: url(#card); stroke: #64748b; stroke-opacity: 0.35; stroke-width: 1.4; }
      .panel { fill: url(#panel); stroke: #64748b; stroke-opacity: 0.28; stroke-width: 1.4; }
      .iconCircle { fill: #0f172a; stroke: url(#accent); stroke-width: 2; }
      .connector { fill: none; stroke: url(#accent); stroke-width: 2.6; stroke-linecap: round; stroke-opacity: 0.7; }
    </style>
  </defs>

  <rect width="1600" height="980" fill="url(#bg)"/>
  <rect width="1600" height="980" fill="url(#grid)"/>
  <circle cx="220" cy="160" r="200" fill="#14B8A6" opacity="0.07"/>
  <circle cx="1380" cy="150" r="220" fill="#8B5CF6" opacity="0.08"/>
  <circle cx="800" cy="820" r="280" fill="#3B82F6" opacity="0.07"/>

  <text x="800" y="64" class="subtitle" text-anchor="middle">CLI and Desktop · one local library</text>

  <g>
    <rect class="panel" x="56" y="92" width="1488" height="148" rx="28"/>
    <text x="88" y="136" class="sectionTitle">Agent harnesses</text>
    <text x="88" y="164" class="sectionCopy">Apply plugins to every target without scattering configuration.</text>

    <rect x="88" y="182" width="168" height="40" rx="20" fill="#0f172a" stroke="#14B8A6" stroke-opacity="0.55"/>
    <text x="172" y="208" class="chipText">Claude Code</text>

    <rect x="268" y="182" width="124" height="40" rx="20" fill="#0f172a" stroke="#3B82F6" stroke-opacity="0.55"/>
    <text x="330" y="208" class="chipText">Cursor</text>

    <rect x="404" y="182" width="118" height="40" rx="20" fill="#0f172a" stroke="#8B5CF6" stroke-opacity="0.55"/>
    <text x="463" y="208" class="chipText">Codex</text>

    <rect x="534" y="182" width="132" height="40" rx="20" fill="#0f172a" stroke="#14B8A6" stroke-opacity="0.55"/>
    <text x="600" y="208" class="chipText">Copilot</text>

    <rect x="678" y="182" width="118" height="40" rx="20" fill="#0f172a" stroke="#3B82F6" stroke-opacity="0.55"/>
    <text x="737" y="208" class="chipText">Goose</text>

    <rect x="808" y="182" width="150" height="40" rx="20" fill="#0f172a" stroke="#8B5CF6" stroke-opacity="0.55"/>
    <text x="883" y="208" class="chipText">Grok Build</text>

    <rect x="970" y="182" width="154" height="40" rx="20" fill="#0f172a" stroke="#14B8A6" stroke-opacity="0.55"/>
    <text x="1047" y="208" class="chipText">30+ more CLIs</text>
  </g>

  <path class="connector" d="M800 240 V284"/>

  <g>
    <rect x="400" y="284" width="800" height="96" rx="28" fill="#0f172a" stroke="url(#accent)" stroke-width="2.2"/>
    <circle cx="468" cy="332" r="28" fill="#020617" stroke="url(#accent)" stroke-width="2.2"/>
    <path d="M456 332 H480 M468 320 V344" stroke="#14B8A6" stroke-width="3.5" stroke-linecap="round"/>
    <text x="516" y="326" class="hubTitle">HarnessTap</text>
    <text x="516" y="356" class="hubCopy">scan · plugin · profile · apply · CLI · Desktop</text>
  </g>

  <path class="connector" d="M800 380 V408"/>

  <g transform="translate(56 408)">
    <rect class="card" width="354" height="176" rx="24"/>
    <circle class="iconCircle" cx="48" cy="46" r="22"/>
    <path d="M38 46 h20 M48 36 v20" stroke="#14B8A6" stroke-width="4" stroke-linecap="round"/>
    <text x="82" y="54" class="label">Scan</text>
    <text x="24" y="100" class="small">Find repo and home</text>
    <text x="24" y="124" class="small">assistant config.</text>
  </g>

  <g transform="translate(434 408)">
    <rect class="card" width="354" height="176" rx="24"/>
    <circle class="iconCircle" cx="48" cy="46" r="22"/>
    <ellipse cx="48" cy="38" rx="14" ry="6" fill="none" stroke="#3B82F6" stroke-width="3"/>
    <path d="M34 38 v16 c0 4 6 7 14 7 s14 -3 14 -7 V38" fill="none" stroke="#3B82F6" stroke-width="3"/>
    <text x="82" y="54" class="label">Library</text>
    <text x="24" y="100" class="small">Canonical SQLite</text>
    <text x="24" y="124" class="small">resource store.</text>
  </g>

  <g transform="translate(812 408)">
    <rect class="card" width="354" height="176" rx="24"/>
    <circle class="iconCircle" cx="48" cy="46" r="22"/>
    <path d="M36 38 h24 M36 47 h24 M36 56 h16" stroke="#8B5CF6" stroke-width="3.6" stroke-linecap="round"/>
    <text x="82" y="54" class="label">Plugins</text>
    <text x="24" y="100" class="small">Versioned packages,</text>
    <text x="24" y="124" class="small">deps, and environments.</text>
  </g>

  <g transform="translate(1190 408)">
    <rect class="card" width="354" height="176" rx="24"/>
    <circle class="iconCircle" cx="48" cy="46" r="22"/>
    <path d="M36 46 h24 M48 37 l12 9 -12 9" fill="none" stroke="#14B8A6" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="82" y="54" class="label">Apply</text>
    <text x="24" y="100" class="small">Materialize with env</text>
    <text x="24" y="124" class="small">cascade to harnesses.</text>
  </g>

  <g transform="translate(56 612)">
    <rect class="card" width="480" height="156" rx="24"/>
    <circle class="iconCircle" cx="48" cy="46" r="22"/>
    <path d="M40 52 h16 M40 40 h12 M40 40 v12 h8" fill="none" stroke="#14B8A6" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="82" y="54" class="label">Profiles</text>
    <text x="24" y="100" class="small">Switch machine-wide setups.</text>
    <text x="24" y="124" class="small">ht work · profile use</text>
  </g>

  <g transform="translate(560 612)">
    <rect class="card" width="480" height="156" rx="24"/>
    <circle class="iconCircle" cx="48" cy="46" r="22"/>
    <path d="M34 50 C39 38 51 38 56 50 C51 62 39 62 34 50 Z" fill="none" stroke="#3B82F6" stroke-width="3.2"/>
    <path d="M48 30 v40 M28 50 h40" stroke="#3B82F6" stroke-width="2.4" stroke-linecap="round" opacity="0.45"/>
    <text x="82" y="54" class="label">Cloud</text>
    <text x="24" y="100" class="small">Catalog baselines,</text>
    <text x="24" y="124" class="small">search, pull, publish.</text>
  </g>

  <g transform="translate(1064 612)">
    <rect class="card" width="480" height="156" rx="24"/>
    <circle class="iconCircle" cx="48" cy="46" r="22"/>
    <path d="M36 46 h24 M54 34 l12 12 -12 12" fill="none" stroke="#8B5CF6" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="82" y="54" class="label">Migrate</text>
    <text x="24" y="100" class="small">Export the library,</text>
    <text x="24" y="124" class="small">harness prefs, and config.</text>
  </g>

  <g transform="translate(56 796)">
    <rect class="card" width="1488" height="64" rx="22"/>
    <text x="744" y="40" class="tiny" text-anchor="middle">41 harnesses · snapshots and drift · Agent Plugins packages · env cascade · plugin deps</text>
  </g>
</svg>
