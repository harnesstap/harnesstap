<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title" aria-describedby="desc">
  <title id="title">HarnessDeck feature map</title>
  <desc id="desc">HarnessDeck connects Claude Code, Cursor, Codex, GitHub Copilot, and other coding harnesses through scan, canonical SQLite library storage, reusable layers, apply and sync, snapshots, drift detection, plugin governance, cloud sharing, and migration export features.</desc>
  <defs>
    <radialGradient id="bg" cx="50%" cy="28%" r="88%">
      <stop offset="0%" stop-color="#24316d"/>
      <stop offset="48%" stop-color="#101833"/>
      <stop offset="100%" stop-color="#050814"/>
    </radialGradient>
    <linearGradient id="panel" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#182449" stop-opacity="0.96"/>
      <stop offset="100%" stop-color="#0b1227" stop-opacity="0.92"/>
    </linearGradient>
    <linearGradient id="card" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#172445" stop-opacity="0.98"/>
      <stop offset="100%" stop-color="#0c1329" stop-opacity="0.95"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" x2="1">
      <stop offset="0%" stop-color="#36f3ff"/>
      <stop offset="52%" stop-color="#9f7aea"/>
      <stop offset="100%" stop-color="#ff6bcb"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feColorMatrix in="blur" values="0 0 0 0 0.33 0 0 0 0 0.82 0 0 0 0 1 0 0 0 0.72 0"/>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="12" result="shadowBlur"/>
      <feOffset in="shadowBlur" dy="18" result="shadowOffset"/>
      <feFlood flood-color="#00051a" flood-opacity="0.5" result="shadowColor"/>
      <feComposite in="shadowColor" in2="shadowOffset" operator="in" result="shadow"/>
      <feMerge>
        <feMergeNode in="shadow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M 48 0 L 0 0 0 48" fill="none" stroke="#8aa0ff" stroke-opacity="0.08" stroke-width="1"/>
    </pattern>
    <style>
      .title { fill: #f8fbff; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 68px; font-weight: 820; letter-spacing: -1.8px; }
      .subtitle { fill: #bfd0ff; font-family: Inter, ui-sans-serif, system-ui, sans-serif; font-size: 24px; font-weight: 520; }
      .sectionTitle { fill: #f7fbff; font-family: Inter, ui-sans-serif, system-ui, sans-serif; font-size: 28px; font-weight: 800; }
      .sectionCopy { fill: #b8c9ff; font-family: Inter, ui-sans-serif, system-ui, sans-serif; font-size: 17px; font-weight: 520; }
      .chipText { fill: #edf6ff; font-family: Inter, ui-sans-serif, system-ui, sans-serif; font-size: 18px; font-weight: 760; text-anchor: middle; dominant-baseline: middle; }
      .hubTitle { fill: #ffffff; font-family: Inter, ui-sans-serif, system-ui, sans-serif; font-size: 36px; font-weight: 860; letter-spacing: -0.8px; }
      .hubCopy { fill: #d7e4ff; font-family: Inter, ui-sans-serif, system-ui, sans-serif; font-size: 18px; font-weight: 560; }
      .label { fill: #f7fbff; font-family: Inter, ui-sans-serif, system-ui, sans-serif; font-size: 24px; font-weight: 800; }
      .small { fill: #b9c8ff; font-family: Inter, ui-sans-serif, system-ui, sans-serif; font-size: 17px; font-weight: 520; }
      .tiny { fill: #d7e3ff; font-family: Inter, ui-sans-serif, system-ui, sans-serif; font-size: 15px; font-weight: 650; letter-spacing: 0.2px; }
      .card { fill: url(#card); stroke: #7a8dff; stroke-opacity: 0.32; stroke-width: 1.4; }
      .panel { fill: url(#panel); stroke: #7a8dff; stroke-opacity: 0.24; stroke-width: 1.4; }
      .iconCircle { fill: #101835; stroke: url(#accent); stroke-width: 2; }
      .connector { fill: none; stroke: url(#accent); stroke-width: 3; stroke-linecap: round; stroke-opacity: 0.7; }
      .flow { fill: none; stroke: #74fbff; stroke-width: 2; stroke-dasharray: 6 10; stroke-linecap: round; stroke-opacity: 0.55; }
    </style>
  </defs>

  <rect width="1600" height="1000" fill="url(#bg)"/>
  <rect width="1600" height="1000" fill="url(#grid)"/>
  <circle cx="260" cy="180" r="220" fill="#36f3ff" opacity="0.09"/>
  <circle cx="1310" cy="170" r="240" fill="#ff6bcb" opacity="0.08"/>
  <circle cx="800" cy="760" r="360" fill="#8b5cf6" opacity="0.08"/>

  <text x="800" y="92" class="title" text-anchor="middle">HarnessDeck</text>
  <text x="800" y="130" class="subtitle" text-anchor="middle">One control plane for every coding agent harness</text>

  <g filter="url(#softShadow)">
    <rect class="panel" x="170" y="172" width="1260" height="160" rx="34"/>
    <text x="220" y="226" class="sectionTitle">Agent harnesses</text>
    <text x="220" y="254" class="sectionCopy">One layer can target every environment without scattering configuration across separate diagrams.</text>

    <g>
      <rect x="216" y="274" width="176" height="42" rx="21" fill="#101835" stroke="#53efff" stroke-opacity="0.52"/>
      <text x="304" y="296" class="chipText">Claude Code</text>

      <rect x="414" y="274" width="138" height="42" rx="21" fill="#101835" stroke="#9f7aea" stroke-opacity="0.52"/>
      <text x="483" y="296" class="chipText">Cursor</text>

      <rect x="574" y="274" width="132" height="42" rx="21" fill="#101835" stroke="#ff6bcb" stroke-opacity="0.52"/>
      <text x="640" y="296" class="chipText">Codex</text>

      <rect x="728" y="274" width="210" height="42" rx="21" fill="#101835" stroke="#53efff" stroke-opacity="0.52"/>
      <text x="833" y="296" class="chipText">GitHub Copilot</text>

      <rect x="960" y="274" width="156" height="42" rx="21" fill="#101835" stroke="#9f7aea" stroke-opacity="0.52"/>
      <text x="1038" y="296" class="chipText">Other CLIs</text>

      <rect x="1138" y="274" width="246" height="42" rx="21" fill="#101835" stroke="#ff6bcb" stroke-opacity="0.52"/>
      <text x="1261" y="296" class="chipText">Portable adapters</text>
    </g>
  </g>

  <g opacity="0.82">
    <path class="connector" d="M800 332 V390"/>
    <path class="flow" d="M570 390 H1030"/>
    <path class="connector" d="M800 494 V532"/>
  </g>

  <g filter="url(#softShadow)">
    <rect x="470" y="392" width="660" height="108" rx="34" fill="#0b1227" stroke="url(#accent)" stroke-width="2.2"/>
    <circle cx="548" cy="446" r="34" fill="#091022" stroke="url(#accent)" stroke-width="2.4" filter="url(#glow)"/>
    <path d="M532 446 H564 M548 430 V462" stroke="#071026" stroke-width="8" stroke-linecap="round"/>
    <text x="606" y="440" class="hubTitle">HarnessDeck</text>
    <text x="606" y="468" class="hubCopy">scan - normalize - layer - apply - sync</text>
  </g>

  <g filter="url(#softShadow)">
    <g transform="translate(150 560)">
      <rect class="card" width="300" height="156" rx="26"/>
      <circle class="iconCircle" cx="54" cy="48" r="24"/>
      <path d="M44 48 h20 M54 38 v20" stroke="#74fbff" stroke-width="4.5" stroke-linecap="round"/>
      <text x="92" y="52" class="label">Scan</text>
      <text x="28" y="96" class="small">Find existing repo and home</text>
      <text x="28" y="120" class="small">assistant configuration.</text>
    </g>

    <g transform="translate(490 560)">
      <rect class="card" width="300" height="156" rx="26"/>
      <circle class="iconCircle" cx="54" cy="48" r="24"/>
      <ellipse cx="54" cy="40" rx="15" ry="7" fill="none" stroke="#b48cff" stroke-width="3"/>
      <path d="M39 40 v18 c0 4 6.5 8 15 8 s15 -4 15 -8 V40" fill="none" stroke="#b48cff" stroke-width="3"/>
      <text x="92" y="52" class="label">SQLite library</text>
      <text x="28" y="96" class="small">Store resources canonically</text>
      <text x="28" y="120" class="small">instead of per-tool sprawl.</text>
    </g>

    <g transform="translate(830 560)">
      <rect class="card" width="300" height="156" rx="26"/>
      <circle class="iconCircle" cx="54" cy="48" r="24"/>
      <path d="M42 40 h24 M42 49 h24 M42 58 h16" stroke="#ff6bcb" stroke-width="4" stroke-linecap="round"/>
      <text x="92" y="52" class="label">Reusable layers</text>
      <text x="28" y="96" class="small">Bundle skills, rules, commands,</text>
      <text x="28" y="120" class="small">dependencies, and version pins.</text>
    </g>

    <g transform="translate(1170 560)">
      <rect class="card" width="280" height="156" rx="26"/>
      <circle class="iconCircle" cx="54" cy="48" r="24"/>
      <path d="M41 48 h26 M54 39 l13 9 -13 9" fill="none" stroke="#74fbff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="92" y="52" class="label">Apply &amp; sync</text>
      <text x="28" y="96" class="small">Materialize one layer into</text>
      <text x="28" y="120" class="small">platform-specific files.</text>
    </g>

    <g transform="translate(150 744)">
      <rect class="card" width="300" height="156" rx="26"/>
      <circle class="iconCircle" cx="54" cy="48" r="24"/>
      <path d="M42 54 h24 M42 42 h16 M42 42 l0 12 10 0" fill="none" stroke="#74fbff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="92" y="52" class="label">Snapshots</text>
      <text x="28" y="96" class="small">Capture before writes.</text>
      <text x="28" y="120" class="small">Revert with confidence.</text>
    </g>

    <g transform="translate(490 744)">
      <rect class="card" width="300" height="156" rx="26"/>
      <circle class="iconCircle" cx="54" cy="48" r="24"/>
      <path d="M40 57 C46 42 56 42 64 33" fill="none" stroke="#b48cff" stroke-width="4" stroke-linecap="round"/>
      <circle cx="41" cy="58" r="4" fill="#b48cff"/>
      <circle cx="51" cy="47" r="4" fill="#b48cff"/>
      <circle cx="64" cy="34" r="4" fill="#b48cff"/>
      <text x="92" y="52" class="label">Drift detection</text>
      <text x="28" y="96" class="small">Compare tracked state.</text>
      <text x="28" y="120" class="small">See what changed.</text>
    </g>

    <g transform="translate(830 744)">
      <rect class="card" width="300" height="156" rx="26"/>
      <circle class="iconCircle" cx="54" cy="48" r="24"/>
      <path d="M42 56 h24 M42 48 h18 M42 40 h24" stroke="#ff6bcb" stroke-width="4" stroke-linecap="round"/>
      <text x="92" y="52" class="label">Plugin governance</text>
      <text x="28" y="96" class="small">Inventory plugins.</text>
      <text x="28" y="120" class="small">Respect constraints.</text>
    </g>

    <g transform="translate(1170 744)">
      <rect class="card" width="280" height="156" rx="26"/>
      <circle class="iconCircle" cx="54" cy="48" r="24"/>
      <path d="M40 52 C45 40 57 40 62 52 C57 64 45 64 40 52 Z" fill="none" stroke="#74fbff" stroke-width="3.5"/>
      <path d="M54 30 v44 M32 52 h44" stroke="#74fbff" stroke-width="2.8" stroke-linecap="round" opacity="0.45"/>
      <text x="92" y="52" class="label">Cloud sharing</text>
      <text x="28" y="96" class="small">Search, add, publish</text>
      <text x="28" y="120" class="small">team-ready layers.</text>
    </g>

    <g transform="translate(420 904)">
      <rect class="card" width="760" height="82" rx="28"/>
      <circle class="iconCircle" cx="58" cy="41" r="22"/>
      <path d="M46 41 h24 M64 29 l12 12 -12 12" fill="none" stroke="#74fbff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="96" y="46" class="label">Migration export</text>
      <text x="334" y="38" class="small">
        <tspan x="334" dy="0">Move libraries, preferences, and config</tspan>
        <tspan x="334" dy="22">across harnesses without losing structure.</tspan>
      </text>
    </g>
  </g>

  <g transform="translate(500 514)">
    <rect width="600" height="34" rx="17" fill="#071026" opacity="0.72" stroke="#ffffff" stroke-opacity="0.12"/>
    <text x="300" y="22" class="tiny" text-anchor="middle">portable JSON bundles - built-in starter layers - layer doctor - diffs</text>
  </g>
</svg>
