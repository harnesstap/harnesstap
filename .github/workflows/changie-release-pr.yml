name: Generate Release PR

on:
  workflow_dispatch:

jobs:
  generate-pr:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Choose Changie batch version
        id: batch
        run: |
          if compgen -G ".changes/v*.md" > /dev/null; then
            echo "args=auto" >> "$GITHUB_OUTPUT"
          else
            echo "args=v0.1.0" >> "$GITHUB_OUTPUT"
          fi

      - name: Batch changes
        uses: miniscruff/changie-action@v3
        with:
          version: latest
          args: batch ${{ steps.batch.outputs.args }}

      - name: Merge changes
        uses: miniscruff/changie-action@v3
        with:
          version: latest
          args: merge

      - name: Get the latest version
        id: latest
        uses: miniscruff/changie-action@v3
        with:
          version: latest
          args: latest

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Bump package.json version
        run: |
          LATEST_VERSION="${{ steps.latest.outputs.output }}"
          VERSION="${LATEST_VERSION#v}"
          CURRENT="$(node -p "require('./package.json').version")"
          if [ "$CURRENT" = "$VERSION" ]; then
            echo "package.json already at $VERSION"
            exit 0
          fi
          npm version "$VERSION" --no-git-tag-version

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v8
        with:
          title: Release ${{ steps.latest.outputs.output }}
          branch: release/${{ steps.latest.outputs.output }}
          commit-message: Release ${{ steps.latest.outputs.output }}
          body: |
            Release ${{ steps.latest.outputs.output }}.

            After merge, [Tag release](https://github.com/harnesstap/harnesstap/actions/workflows/tag-release.yml) pushes the Git tag if it is missing. [Release](https://github.com/harnesstap/harnesstap/actions/workflows/release.yml) then publishes to npm (trusted publishing), creates the GitHub release, and attaches unsigned desktop installers.
