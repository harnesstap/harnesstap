name: Tag release

on:
  push:
    branches:
      - main
    paths:
      - CHANGELOG.md

jobs:
  tag:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get the latest version
        id: latest
        continue-on-error: true
        uses: miniscruff/changie-action@v3
        with:
          version: latest
          args: latest

      - name: Create and push tag if missing
        if: steps.latest.outcome == 'success' && steps.latest.outputs.output != ''
        run: |
          TAG="${{ steps.latest.outputs.output }}"
          if [ "$TAG" = "v0.0.0" ] || [ "$TAG" = "0.0.0" ] || [ ! -f ".changes/${TAG}.md" ]; then
            echo "No batched changelog for $TAG; skipping tag."
            exit 0
          fi
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists; skipping."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag "$TAG"
          git push origin "$TAG"
