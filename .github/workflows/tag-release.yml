name: Tag release

on:
  push:
    branches:
      - main
    paths:
      - CHANGELOG.md
  workflow_dispatch:

jobs:
  tag:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Require main branch
        run: |
          set -euo pipefail
          if [ "${GITHUB_REF_NAME}" != "main" ]; then
            echo "Tag release only cuts from main (ref is ${GITHUB_REF_NAME})."
            exit 1
          fi

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Get the latest version
        id: latest
        continue-on-error: true
        uses: miniscruff/changie-action@v3
        with:
          version: latest
          args: latest

      - name: Plan release cut
        id: plan
        env:
          CHANGIE_LATEST: ${{ steps.latest.outputs.output }}
        run: bash scripts/tag-release-plan.sh

      - name: Batch unreleased changes
        if: steps.plan.outputs.has_unreleased == 'true'
        uses: miniscruff/changie-action@v3
        with:
          version: latest
          args: batch ${{ steps.plan.outputs.batch_args }}

      - name: Merge changelog
        if: steps.plan.outputs.has_unreleased == 'true'
        uses: miniscruff/changie-action@v3
        with:
          version: latest
          args: merge

      - name: Refresh latest version after batch
        id: batched
        if: steps.plan.outputs.has_unreleased == 'true'
        uses: miniscruff/changie-action@v3
        with:
          version: latest
          args: latest

      - name: Stamp CLI and Desktop versions
        if: steps.plan.outputs.action == 'prepare'
        env:
          TAG: ${{ steps.batched.outputs.output || steps.plan.outputs.batched_version }}
        run: |
          set -euo pipefail
          if [ -z "${TAG}" ]; then
            echo "No Changie version to stamp."
            exit 1
          fi
          bash scripts/stamp-release-version.sh "$TAG"

      - name: Commit release files
        if: steps.plan.outputs.action == 'prepare'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md .changes package.json \
            apps/desktop/package.json \
            apps/desktop/src-tauri/tauri.conf.json \
            apps/desktop/src-tauri/Cargo.toml \
            apps/desktop/src-tauri/Cargo.lock
          TAG="${{ steps.batched.outputs.output || steps.plan.outputs.batched_version }}"
          if git diff --cached --quiet; then
            echo "No version files to commit."
            exit 0
          fi
          git commit -m "Release ${TAG}"
          git push origin HEAD:main

      - name: Create and push tag if missing
        id: tag
        if: steps.plan.outputs.action == 'prepare' || steps.plan.outputs.action == 'tag'
        run: |
          set -euo pipefail
          TAG="${{ steps.batched.outputs.output || steps.plan.outputs.batched_version }}"
          created=false
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          if [ -z "$TAG" ] || [ "$TAG" = "v0.0.0" ] || [ "$TAG" = "0.0.0" ] || [ ! -f ".changes/${TAG}.md" ]; then
            echo "No batched changelog for ${TAG:-<empty>}; skipping tag."
            echo "created=${created}" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git fetch origin --tags
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists; skipping."
            echo "created=${created}" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag "$TAG"
          git push origin "$TAG"
          created=true
          echo "created=${created}" >> "$GITHUB_OUTPUT"

      - name: Write tag-release result
        if: always()
        run: |
          mkdir -p /tmp/tag-release-result
          {
            echo "created=${{ steps.tag.outputs.created || 'false' }}"
            echo "tag=${{ steps.tag.outputs.tag || '' }}"
          } > /tmp/tag-release-result/result.env

      - name: Upload tag-release result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tag-release-result
          path: /tmp/tag-release-result/result.env
          retention-days: 7
