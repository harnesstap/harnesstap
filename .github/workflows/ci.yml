name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  docs-changed:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect docs changes
        id: docs
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
            HEAD="${{ github.sha }}"
          else
            BASE="${{ github.event.before }}"
            HEAD="${{ github.sha }}"
          fi
          if git diff --name-only "$BASE" "$HEAD" -- docs/ | grep -q .; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Remind to sync Cloud docs
        if: steps.docs.outputs.changed == 'true'
        run: |
          echo "Docs changed — run \`bun run sync:cli-docs\` in harnessdeck-cloud with sibling harnessdeck checkout."

  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run tests
        run: bun test --dots --parallel=1 --max-concurrency=1

      - name: Run Biome lint
        run: bun run lint

      - name: Run type-check
        run: bun run typecheck

      - name: Build distribution
        run: bun run build
