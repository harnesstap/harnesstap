name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run tests
        run: bun test --dots --parallel=1 --max-concurrency=1

      - name: Run Biome lint
        run: bun run lint

      - name: Run type-check
        run: bun run typecheck

      - name: Build distribution
        run: bun run build
