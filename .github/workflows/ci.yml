name: CI

on:
  push:
    branches:
      - main
  pull_request:
  # Merge queue: the queue builds gh-readonly-queue/* branches and fires
  # merge_group instead of pull_request. Same job names, so the required
  # contexts (test-*, desktop-typecheck, validate) report as on a PR. Path
  # filters diff merge_group.base_sha..head_sha (no pull_request payload exists);
  # jobs skipped by `if:` still count as passing for required checks.
  merge_group:
    types: [checks_requested]
  schedule:
    - cron: "17 6 * * *"
  # Manual nightly-equivalent: `gh workflow run ci.yml --ref main` runs every
  # job, the same as the schedule.
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

env:
  # Nightly and manual runs shuffle test order so order-dependent tests show
  # up (bun prints the seed; rerun with `bun test --seed=N`). PR and merge
  # queue runs keep the default order.
  BUN_TEST_ORDER: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && '--randomize' || '' }}

jobs:
  docs-changed:
    if: github.event_name != 'schedule' && github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-26.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect docs changes
        id: docs
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          MERGE_GROUP_BASE_SHA: ${{ github.event.merge_group.base_sha }}
          MERGE_GROUP_HEAD_SHA: ${{ github.event.merge_group.head_sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          GITHUB_SHA_CURRENT: ${{ github.sha }}
        run: |
          case "$EVENT_NAME" in
            pull_request)
              BASE="$PR_BASE_SHA"
              HEAD="$GITHUB_SHA_CURRENT"
              ;;
            merge_group)
              BASE="$MERGE_GROUP_BASE_SHA"
              HEAD="$MERGE_GROUP_HEAD_SHA"
              ;;
            *)
              BASE="$PUSH_BEFORE_SHA"
              HEAD="$GITHUB_SHA_CURRENT"
              ;;
          esac
          if git diff --name-only "$BASE" "$HEAD" -- docs/ | grep -q .; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Remind to sync Cloud docs
        if: steps.docs.outputs.changed == 'true'
        run: |
          echo "Docs changed — run \`bun run sync:cli-docs\` in harnesstap-cloud with sibling harnesstap checkout."

  detect-changes:
    runs-on: ubuntu-26.04
    outputs:
      global: ${{ steps.resolve.outputs.global }}
      core: ${{ steps.resolve.outputs.core }}
      platforms: ${{ steps.resolve.outputs.platforms }}
      plugins: ${{ steps.resolve.outputs.plugins }}
      services: ${{ steps.resolve.outputs.services }}
      cli: ${{ steps.resolve.outputs.cli }}
      agent: ${{ steps.resolve.outputs.agent }}
      docs: ${{ steps.resolve.outputs.docs }}
      desktop: ${{ steps.resolve.outputs.desktop }}
      desktop_visual: ${{ steps.resolve.outputs.desktop_visual }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Detect changed paths on pull request or merge group
        if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
        id: filter
        uses: dorny/paths-filter@v3
        with:
          base: ${{ github.event_name == 'merge_group' && github.event.merge_group.base_sha || '' }}
          ref: ${{ github.event_name == 'merge_group' && github.event.merge_group.head_sha || '' }}
          filters: |
            global:
              - 'package.json'
              - 'bun.lock'
              - 'tsconfig.json'
              - 'biome.json'
              - 'tsup.config.ts'
              - 'bunfig.toml'
              - 'src/types.ts'
              - 'src/version.ts'
              - 'src/index.ts'
              - 'src/cli/**'
              - 'test/helpers/**'
            core:
              - 'src/db/**'
              - 'src/models/**'
              - 'src/config/**'
              - 'src/constants/**'
              - 'src/utils/**'
              - 'src/telemetry/**'
              - 'test/telemetry/**'
              - 'scripts/check-copy.ts'
              - 'scripts/copy-allowlist.txt'
              - 'test/scripts/**'
            platforms:
              - 'src/platforms/**'
            plugins:
              - 'src/plugins/**'
              - 'test/plugins/**'
            services:
              - 'src/services/**'
              - 'src/agent/**'
              - 'test/services/**'
              - 'test/integration/**'
            cli:
              - 'src/ui/**'
              - 'test/cli/**'
              - 'test/ui/**'
            agent:
              - 'src/agent/**'
              - 'test/agent/**'
              - '.github/workflows/ci.yml'
            docs:
              - 'docs/**'
              - 'test/docs/**'
            desktop:
              - 'apps/desktop/src/**'
              - 'apps/desktop/scripts/**'
              - 'apps/desktop/package.json'
              - 'apps/desktop/bun.lock'
              - 'apps/desktop/tsconfig*.json'
              - 'apps/desktop/index.html'
              - 'apps/desktop/vite.config.ts'
              - 'test/desktop/**'
              - '.github/workflows/ci.yml'
            desktop_visual:
              - 'apps/desktop/src/**'
              - 'apps/desktop/e2e/visual/**'
              - 'apps/desktop/scripts/ui-shots.mjs'
              - 'apps/desktop/scripts/visual-compare.mjs'
              - 'apps/desktop/scripts/desktop-check.sh'
              - 'apps/desktop/scripts/demo-home.sh'
              - 'apps/desktop/scripts/visual-pin.env'
              - 'apps/desktop/scripts/update-visual-baselines.sh'
              - '.github/actions/desktop-visual/**'
              - '.github/workflows/desktop-e2e.yml'

      - name: Resolve change flags
        id: resolve
        run: |
          if [ "${{ github.event_name }}" = "push" ] || [ "${{ github.event_name }}" = "schedule" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            for area in global core platforms plugins services cli agent docs desktop; do
              echo "${area}=true" >> "$GITHUB_OUTPUT"
            done
            # Nightly visual is desktop-e2e.yml; do not duplicate it on every main push.
            echo "desktop_visual=false" >> "$GITHUB_OUTPUT"
          else
            echo "global=${{ steps.filter.outputs.global }}" >> "$GITHUB_OUTPUT"
            echo "core=${{ steps.filter.outputs.core }}" >> "$GITHUB_OUTPUT"
            echo "platforms=${{ steps.filter.outputs.platforms }}" >> "$GITHUB_OUTPUT"
            echo "plugins=${{ steps.filter.outputs.plugins }}" >> "$GITHUB_OUTPUT"
            echo "services=${{ steps.filter.outputs.services }}" >> "$GITHUB_OUTPUT"
            echo "cli=${{ steps.filter.outputs.cli }}" >> "$GITHUB_OUTPUT"
            echo "agent=${{ steps.filter.outputs.agent }}" >> "$GITHUB_OUTPUT"
            echo "docs=${{ steps.filter.outputs.docs }}" >> "$GITHUB_OUTPUT"
            echo "desktop=${{ steps.filter.outputs.desktop }}" >> "$GITHUB_OUTPUT"
            echo "desktop_visual=${{ steps.filter.outputs.desktop_visual }}" >> "$GITHUB_OUTPUT"
          fi

  test-core:
    needs: detect-changes
    if: >-
      needs.detect-changes.outputs.global == 'true' ||
      needs.detect-changes.outputs.core == 'true' ||
      needs.detect-changes.outputs.services == 'true' ||
      needs.detect-changes.outputs.cli == 'true'
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run test:core $BUN_TEST_ORDER

  test-platforms:
    needs: detect-changes
    if: >-
      needs.detect-changes.outputs.global == 'true' ||
      needs.detect-changes.outputs.core == 'true' ||
      needs.detect-changes.outputs.platforms == 'true' ||
      needs.detect-changes.outputs.services == 'true' ||
      needs.detect-changes.outputs.cli == 'true'
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run test:platforms $BUN_TEST_ORDER

  test-plugins:
    needs: detect-changes
    if: >-
      needs.detect-changes.outputs.global == 'true' ||
      needs.detect-changes.outputs.core == 'true' ||
      needs.detect-changes.outputs.plugins == 'true' ||
      needs.detect-changes.outputs.services == 'true'
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run test:plugins $BUN_TEST_ORDER

  test-services:
    needs: detect-changes
    if: >-
      needs.detect-changes.outputs.global == 'true' ||
      needs.detect-changes.outputs.core == 'true' ||
      needs.detect-changes.outputs.platforms == 'true' ||
      needs.detect-changes.outputs.plugins == 'true' ||
      needs.detect-changes.outputs.services == 'true' ||
      needs.detect-changes.outputs.cli == 'true'
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run test:services $BUN_TEST_ORDER

  test-cli:
    needs: detect-changes
    if: >-
      needs.detect-changes.outputs.global == 'true' ||
      needs.detect-changes.outputs.core == 'true' ||
      needs.detect-changes.outputs.services == 'true' ||
      needs.detect-changes.outputs.cli == 'true'
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run test:cli $BUN_TEST_ORDER

  test-agent:
    needs: detect-changes
    if: >-
      needs.detect-changes.outputs.global == 'true' ||
      needs.detect-changes.outputs.core == 'true' ||
      needs.detect-changes.outputs.platforms == 'true' ||
      needs.detect-changes.outputs.plugins == 'true' ||
      needs.detect-changes.outputs.services == 'true' ||
      needs.detect-changes.outputs.agent == 'true'
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run test:agent $BUN_TEST_ORDER

  # test/desktop imports Desktop components (react, clsx), so it needs the
  # apps/desktop install too.
  test-desktop:
    needs: detect-changes
    if: >-
      needs.detect-changes.outputs.global == 'true' ||
      needs.detect-changes.outputs.core == 'true' ||
      needs.detect-changes.outputs.services == 'true' ||
      needs.detect-changes.outputs.cli == 'true' ||
      needs.detect-changes.outputs.desktop == 'true'
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - name: Install desktop dependencies
        working-directory: apps/desktop
        run: bun install --frozen-lockfile
      - run: bun run test:desktop $BUN_TEST_ORDER

  test-docs:
    needs: detect-changes
    if: >-
      needs.detect-changes.outputs.global == 'true' ||
      needs.detect-changes.outputs.docs == 'true'
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run test:docs

  desktop-typecheck:
    needs: detect-changes
    if: needs.detect-changes.outputs.desktop == 'true'
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Install desktop dependencies
        working-directory: apps/desktop
        run: bun install --frozen-lockfile
      - name: Typecheck desktop app
        working-directory: apps/desktop
        run: bunx tsc -p tsconfig.app.json --noEmit

      - name: Compile desktop CSS with Vite
        working-directory: apps/desktop
        run: bunx vite build

      - name: Test linuxdeploy wrappers
        run: bun test --timeout 30000 apps/desktop/scripts

  desktop-visual:
    name: desktop-visual
    needs: detect-changes
    if: needs.detect-changes.outputs.desktop_visual == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
      options: --ipc=host
    steps:
      - uses: actions/checkout@v4
      - name: Git safe directory
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - uses: ./.github/actions/desktop-visual
      - name: Upload visual artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-visual-pr-artifacts
          path: apps/desktop/e2e/artifacts/
          if-no-files-found: ignore
      - name: Upload container shots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-visual-container-shots
          path: apps/desktop/e2e/artifacts/shots/[0-9]*.png
          if-no-files-found: ignore

  desktop-sidecar:
    name: desktop-sidecar (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-26.04, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      # Compiles the real ht-agent sidecar with scripts/build-sidecar.sh, then
      # runs the binary: --version must print the package version and the agent
      # must answer /v1/health. The source agent cannot catch compile-only bugs.
      - name: Build and run compiled sidecar
        shell: bash
        run: bun run check:compiled-sidecar

  validate:
    runs-on: ubuntu-26.04
    needs:
      - detect-changes
      - test-core
      - test-platforms
      - test-plugins
      - test-services
      - test-cli
      - test-agent
      - test-desktop
      - test-docs
      - desktop-typecheck
      - desktop-visual
      - desktop-sidecar
    if: always()
    steps:
      - name: Fail if required tests did not succeed
        env:
          DETECT_CHANGES: ${{ needs.detect-changes.result }}
          DETECT_GLOBAL: ${{ needs.detect-changes.outputs.global }}
          DETECT_CORE: ${{ needs.detect-changes.outputs.core }}
          DETECT_PLATFORMS: ${{ needs.detect-changes.outputs.platforms }}
          DETECT_PLUGINS: ${{ needs.detect-changes.outputs.plugins }}
          DETECT_SERVICES: ${{ needs.detect-changes.outputs.services }}
          DETECT_CLI: ${{ needs.detect-changes.outputs.cli }}
          DETECT_AGENT: ${{ needs.detect-changes.outputs.agent }}
          DETECT_DOCS: ${{ needs.detect-changes.outputs.docs }}
          DETECT_DESKTOP: ${{ needs.detect-changes.outputs.desktop }}
          DETECT_DESKTOP_VISUAL: ${{ needs.detect-changes.outputs.desktop_visual }}
          TEST_CORE: ${{ needs.test-core.result }}
          TEST_PLATFORMS: ${{ needs.test-platforms.result }}
          TEST_PLUGINS: ${{ needs.test-plugins.result }}
          TEST_SERVICES: ${{ needs.test-services.result }}
          TEST_CLI: ${{ needs.test-cli.result }}
          TEST_AGENT: ${{ needs.test-agent.result }}
          TEST_DESKTOP: ${{ needs.test-desktop.result }}
          TEST_DOCS: ${{ needs.test-docs.result }}
          DESKTOP_TYPECHECK: ${{ needs.desktop-typecheck.result }}
          DESKTOP_VISUAL: ${{ needs.desktop-visual.result }}
          DESKTOP_SIDECAR: ${{ needs.desktop-sidecar.result }}
        run: |
          set -euo pipefail
          failed=0
          should_run() {
            local job="$1"
            shift
            if [ "$DETECT_CHANGES" != "success" ]; then
              echo "$job should have run (detect-changes=$DETECT_CHANGES)"
              return 0
            fi
            local flag
            for flag in "$@"; do
              if [ "$flag" = "true" ]; then
                return 0
              fi
            done
            return 1
          }
          check_required() {
            local job="$1"
            local result="$2"
            shift 2
            if should_run "$job" "$@"; then
              if [ "$result" != "success" ]; then
                echo "::error::$job is required but result is $result"
                failed=1
              fi
            elif [ "$result" = "failure" ] || [ "$result" = "cancelled" ]; then
              echo "::error::$job $result"
              failed=1
            fi
          }
          if [ "$DETECT_CHANGES" != "success" ]; then
            echo "::error::detect-changes is required but result is $DETECT_CHANGES"
            failed=1
          fi
          check_required test-core "$TEST_CORE" "$DETECT_GLOBAL" "$DETECT_CORE" "$DETECT_SERVICES" "$DETECT_CLI"
          check_required test-platforms "$TEST_PLATFORMS" "$DETECT_GLOBAL" "$DETECT_CORE" "$DETECT_PLATFORMS" "$DETECT_SERVICES" "$DETECT_CLI"
          check_required test-plugins "$TEST_PLUGINS" "$DETECT_GLOBAL" "$DETECT_CORE" "$DETECT_PLUGINS" "$DETECT_SERVICES"
          check_required test-services "$TEST_SERVICES" "$DETECT_GLOBAL" "$DETECT_CORE" "$DETECT_PLATFORMS" "$DETECT_PLUGINS" "$DETECT_SERVICES" "$DETECT_CLI"
          check_required test-cli "$TEST_CLI" "$DETECT_GLOBAL" "$DETECT_CORE" "$DETECT_SERVICES" "$DETECT_CLI"
          check_required test-agent "$TEST_AGENT" "$DETECT_GLOBAL" "$DETECT_CORE" "$DETECT_PLATFORMS" "$DETECT_PLUGINS" "$DETECT_SERVICES" "$DETECT_AGENT"
          check_required test-desktop "$TEST_DESKTOP" "$DETECT_GLOBAL" "$DETECT_CORE" "$DETECT_SERVICES" "$DETECT_CLI" "$DETECT_DESKTOP"
          check_required test-docs "$TEST_DOCS" "$DETECT_GLOBAL" "$DETECT_DOCS"
          check_required desktop-typecheck "$DESKTOP_TYPECHECK" "$DETECT_DESKTOP"
          check_required desktop-visual "$DESKTOP_VISUAL" "$DETECT_DESKTOP_VISUAL"
          check_required desktop-sidecar "$DESKTOP_SIDECAR" "true"
          if [ "$failed" -ne 0 ]; then
            exit 1
          fi

      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Exports (plugin export, publish, ht pack, fixtures) must validate
      # against the official Agent Plugins 1.0.0 JSON Schemas. The schemas
      # are vendored under test/fixtures/agent-plugins-spec; no network.
      - name: Agent Plugins 1.0.0 schema guard
        run: bun run check:agent-plugins-spec

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Rebuild better-sqlite3 for Node 22
        run: npm rebuild better-sqlite3

      - name: SQLite dual-runtime WAL write smoke
        run: bun run check:sqlite-wal-smoke

      - name: Run Biome lint
        run: bun run lint

      - name: G3 copy lint
        run: bun run check:copy

      - name: Run type-check
        run: bun run typecheck

      - name: Build distribution
        run: bun run build

  pack-cli-tarball:
    name: Pack CLI tarball
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: bun install --frozen-lockfile
      - run: bun run build
      - name: Pack npm tarball
        run: npm pack
      - name: G7 packaged help and README commands
        run: bun run check:packaged-help
      - uses: actions/upload-artifact@v4
        with:
          name: harnesstap-npm-tarball
          path: harnesstap-*.tgz
          if-no-files-found: error
      # npm publish rebuilds dist/ through prepublishOnly. Run that same
      # rebuild and pack: the packed `ht --version` must print the plain
      # package.json version, not `-dev+<sha>` (#501). Runs after the upload
      # so the dev tarball above is unchanged.
      - name: Release build reports the package version
        run: bun run check:release-version

  node-version-matrix:
    name: G1 Node ${{ matrix.image }}
    needs: pack-cli-tarball
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        include:
          # better-sqlite3 is optional (#501): Node 20 has no prebuild, its
          # build fails, and the install still succeeds. Scripts stay on to
          # prove that, and bun x runs the tarball too.
          - image: node:20-slim
            supported: "false"
            expect_install: "true"
            check_gyp: "false"
            ignore_scripts: "false"
            bunx_smoke: "true"
          - image: node:22.11-slim
            supported: "false"
            expect_install: "true"
            check_gyp: "true"
            ignore_scripts: "false"
          - image: node:22-slim
            supported: "true"
            expect_install: "true"
            check_gyp: "true"
            ignore_scripts: "false"
          - image: node:24-slim
            supported: "true"
            expect_install: "true"
            check_gyp: "true"
            ignore_scripts: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: harnesstap-npm-tarball
          path: pack
      - name: Smoke packed CLI in ${{ matrix.image }}
        run: |
          chmod +x scripts/ci-node-version-matrix.sh
          docker run --rm \
            -e SUPPORTED=${{ matrix.supported }} \
            -e EXPECT_INSTALL=${{ matrix.expect_install }} \
            -e CHECK_GYP=${{ matrix.check_gyp }} \
            -e IGNORE_SCRIPTS=${{ matrix.ignore_scripts }} \
            -e BUNX_SMOKE=${{ matrix.bunx_smoke || 'false' }} \
            -v "$PWD/pack:/pack:ro" \
            -v "$PWD/scripts/ci-node-version-matrix.sh:/ci-node-version-matrix.sh:ro" \
            "${{ matrix.image }}" \
            bash -lc 'export TARBALL="$(ls /pack/harnesstap-*.tgz | head -n 1)"; bash /ci-node-version-matrix.sh'
