name: Release

on:
  push:
    tags:
      - "v*"
  # Tag release pushes tags with GITHUB_TOKEN, which does not trigger a tag-push
  # workflow. Run after that job succeeds, and only publish when the new tag
  # points at the triggering commit. npm OIDC still sees this workflow file
  # (release.yml), matching the trusted publisher config — do not workflow_call
  # this from another workflow.
  workflow_run:
    workflows:
      - Tag release
    types:
      - completed

jobs:
  release:
    if: github.event_name == 'push' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.workflow_run.head_sha || github.ref }}

      - name: Fetch tags
        run: git fetch origin --tags

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Get the latest version
        id: latest
        uses: miniscruff/changie-action@v3
        with:
          version: latest
          args: latest

      - name: Resolve release tag
        id: resolve
        run: |
          set -euo pipefail
          LATEST="${{ steps.latest.outputs.output }}"
          if [ "${{ github.event_name }}" = "push" ]; then
            TAG="${GITHUB_REF_NAME}"
            if [ "$TAG" != "$LATEST" ]; then
              echo "Tag $TAG does not match changie latest $LATEST"
              exit 1
            fi
          else
            TAG="$LATEST"
            if ! git rev-parse "$TAG" >/dev/null 2>&1; then
              echo "Tag $TAG does not exist; skipping."
              echo "skip=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            TAG_COMMIT="$(git rev-parse "$TAG^{commit}")"
            HEAD_COMMIT="$(git rev-parse HEAD)"
            if [ "$TAG_COMMIT" != "$HEAD_COMMIT" ]; then
              echo "Tag $TAG ($TAG_COMMIT) is not this commit ($HEAD_COMMIT); skipping."
              echo "skip=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "skip=false" >> "$GITHUB_OUTPUT"

      - name: Verify tag matches package.json
        if: steps.resolve.outputs.skip != 'true'
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          TAG_VERSION="${{ steps.resolve.outputs.tag }}"
          TAG_VERSION="${TAG_VERSION#v}"
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "package.json version ($PKG_VERSION) does not match tag ($TAG_VERSION)"
            exit 1
          fi

      - name: Run preflight
        if: steps.resolve.outputs.skip != 'true'
        run: bun run preflight

      - name: Set up Node for npm publish
        if: steps.resolve.outputs.skip != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org

      - name: Publish to npm
        if: steps.resolve.outputs.skip != 'true'
        run: |
          set -euo pipefail
          VERSION="${{ steps.resolve.outputs.tag }}"
          VERSION="${VERSION#v}"
          if npm view "harnesstap@${VERSION}" version >/dev/null 2>&1; then
            echo "harnesstap@${VERSION} already on npm; skipping publish."
            exit 0
          fi
          npm publish --access public

      - name: Create GitHub release
        if: steps.resolve.outputs.skip != 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.resolve.outputs.tag }}
          body_path: .changes/${{ steps.latest.outputs.output }}.md
          generate_release_notes: false
