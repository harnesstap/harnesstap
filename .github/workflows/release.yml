name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Git tag to publish or attach desktop assets to (default latest Changie version)
        required: false
        type: string
  # Tag release pushes tags with GITHUB_TOKEN, which does not trigger a tag-push
  # workflow. Run after that job succeeds, and only publish when the new tag
  # points at the triggering commit. npm OIDC still sees this workflow file
  # (release.yml), matching the trusted publisher config — do not workflow_call
  # this from another workflow.
  workflow_run:
    workflows:
      - Tag release
    types:
      - completed

jobs:
  release:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    outputs:
      skip: ${{ steps.resolve.outputs.skip }}
      tag: ${{ steps.resolve.outputs.tag }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.workflow_run.head_sha || github.ref }}

      - name: Fetch tags
        run: git fetch origin --tags

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Get the latest version
        id: latest
        uses: miniscruff/changie-action@v3
        with:
          version: latest
          args: latest

      - name: Resolve release tag
        id: resolve
        run: |
          set -euo pipefail
          LATEST="${{ steps.latest.outputs.output }}"
          if [ -z "$LATEST" ] || [ "$LATEST" = "v0.0.0" ] || [ "$LATEST" = "0.0.0" ] || [ ! -f ".changes/${LATEST}.md" ]; then
            echo "No batched changelog for ${LATEST:-<empty>}; skipping."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          EVENT="${{ github.event_name }}"
          if [ "$EVENT" = "push" ]; then
            TAG="${GITHUB_REF_NAME}"
            if [ "$TAG" != "$LATEST" ]; then
              echo "Tag $TAG does not match changie latest $LATEST"
              exit 1
            fi
          elif [ "$EVENT" = "workflow_dispatch" ]; then
            INPUT="${{ github.event.inputs.tag }}"
            TAG="${INPUT:-$LATEST}"
            if [ ! -f ".changes/${TAG}.md" ]; then
              echo "No batched changelog for $TAG; skipping."
              echo "skip=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          else
            TAG="$LATEST"
            if ! git rev-parse "$TAG" >/dev/null 2>&1; then
              echo "Tag $TAG does not exist; skipping."
              echo "skip=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            TAG_COMMIT="$(git rev-parse "$TAG^{commit}")"
            HEAD_COMMIT="$(git rev-parse HEAD)"
            if [ "$TAG_COMMIT" != "$HEAD_COMMIT" ]; then
              echo "Tag $TAG ($TAG_COMMIT) is not this commit ($HEAD_COMMIT); skipping."
              echo "skip=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "skip=false" >> "$GITHUB_OUTPUT"

      - name: Verify tag matches package.json
        if: steps.resolve.outputs.skip != 'true'
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          TAG_VERSION="${{ steps.resolve.outputs.tag }}"
          TAG_VERSION="${TAG_VERSION#v}"
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "package.json version ($PKG_VERSION) does not match tag ($TAG_VERSION)"
            exit 1
          fi

      - name: Lint, typecheck, test, and build
        if: steps.resolve.outputs.skip != 'true'
        run: |
          bun run lint
          bun run typecheck
          bun run test:core
          bun run test:platforms
          bun run test:plugins
          bun run test:services
          bun run test:cli
          bun run test:docs
          bun run build

      - name: Set up Node for npm publish
        if: steps.resolve.outputs.skip != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org

      - name: Publish to npm
        if: steps.resolve.outputs.skip != 'true'
        run: |
          set -euo pipefail
          VERSION="${{ steps.resolve.outputs.tag }}"
          VERSION="${VERSION#v}"
          if npm view "harnesstap@${VERSION}" version >/dev/null 2>&1; then
            echo "harnesstap@${VERSION} already on npm; skipping publish."
            exit 0
          fi
          npm publish --access public

      - name: Create GitHub release
        if: steps.resolve.outputs.skip != 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.resolve.outputs.tag }}
          body_path: .changes/${{ steps.resolve.outputs.tag }}.md
          generate_release_notes: false

  desktop-macos:
    needs: release
    if: needs.release.result == 'success' && needs.release.outputs.skip != 'true'
    runs-on: macos-latest
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - name: Check out tagged sources
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.release.outputs.tag }}

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build macOS app
        run: bun run desktop:build

      - name: Attach DMG to GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${{ needs.release.outputs.tag }}"
          shopt -s nullglob
          dmg_files=(apps/desktop/src-tauri/target/release/bundle/dmg/*.dmg)
          if [ "${#dmg_files[@]}" -eq 0 ]; then
            echo "No DMG produced."
            find apps/desktop/src-tauri/target/release/bundle -type f || true
            exit 1
          fi
          gh release upload "$TAG" "${dmg_files[@]}" --clobber --repo "${{ github.repository }}"
          echo "Uploaded ${dmg_files[*]} to $TAG"
