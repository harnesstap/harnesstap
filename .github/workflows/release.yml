name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Git tag to publish or attach desktop assets to (default latest Changie version)
        required: false
        type: string
  # Tag release pushes tags with GITHUB_TOKEN, which does not trigger a tag-push
  # workflow. Run after that job succeeds. Publish when Tag release created a
  # tag (artifact), including a stamp commit that is a descendant of this run's
  # head. Older Tag release runs without that artifact still publish when the
  # tag points at the triggering commit. npm OIDC still sees this workflow file
  # (release.yml), matching the trusted publisher config — do not workflow_call
  # this from another workflow.
  workflow_run:
    workflows:
      - Tag release
    types:
      - completed

jobs:
  release:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      actions: read
    outputs:
      skip: ${{ steps.resolve.outputs.skip }}
      tag: ${{ steps.resolve.outputs.tag }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.workflow_run.head_sha || github.ref }}

      - name: Fetch tags
        run: git fetch origin --tags

      - name: Download Tag release result
        if: github.event_name == 'workflow_run'
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: tag-release-result
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: /tmp/tag-release-result

      - name: Check out tagged cut
        if: github.event_name == 'workflow_run'
        run: |
          set -euo pipefail
          RESULT="/tmp/tag-release-result/result.env"
          if [ ! -f "$RESULT" ]; then
            echo "No Tag release artifact; using checkout SHA."
            exit 0
          fi
          CREATED="$(sed -n 's/^created=//p' "$RESULT")"
          TAG="$(sed -n 's/^tag=//p' "$RESULT")"
          if [ "$CREATED" != "true" ] || [ -z "$TAG" ]; then
            echo "Tag release did not create a tag; leaving checkout as-is."
            exit 0
          fi
          git fetch origin --tags
          git checkout --force "$TAG"
          echo "Checked out $TAG ($(git rev-parse HEAD))"

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Get the latest version
        id: latest
        uses: miniscruff/changie-action@v3
        with:
          version: latest
          args: latest

      - name: Resolve release tag
        id: resolve
        run: |
          set -euo pipefail
          LATEST="${{ steps.latest.outputs.output }}"
          if [ -z "$LATEST" ] || [ "$LATEST" = "v0.0.0" ] || [ "$LATEST" = "0.0.0" ] || [ ! -f ".changes/${LATEST}.md" ]; then
            echo "No batched changelog for ${LATEST:-<empty>}; skipping."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          EVENT="${{ github.event_name }}"
          if [ "$EVENT" = "push" ]; then
            TAG="${GITHUB_REF_NAME}"
            if [ "$TAG" != "$LATEST" ]; then
              echo "Tag $TAG does not match changie latest $LATEST"
              exit 1
            fi
          elif [ "$EVENT" = "workflow_dispatch" ]; then
            INPUT="${{ github.event.inputs.tag }}"
            TAG="${INPUT:-$LATEST}"
            if [ ! -f ".changes/${TAG}.md" ]; then
              echo "No batched changelog for $TAG; skipping."
              echo "skip=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          else
            CREATED=""
            ARTIFACT_TAG=""
            RESULT="/tmp/tag-release-result/result.env"
            if [ -f "$RESULT" ]; then
              CREATED="$(sed -n 's/^created=//p' "$RESULT")"
              ARTIFACT_TAG="$(sed -n 's/^tag=//p' "$RESULT")"
            fi
            if [ -n "$CREATED" ] && [ "$CREATED" != "true" ]; then
              echo "Tag release did not create a tag; skipping."
              echo "skip=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            TAG="${ARTIFACT_TAG:-$LATEST}"
            if [ ! -f ".changes/${TAG}.md" ]; then
              echo "No batched changelog for $TAG; skipping."
              echo "skip=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            if ! git rev-parse "$TAG" >/dev/null 2>&1; then
              echo "Tag $TAG does not exist; skipping."
              echo "skip=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            TAG_COMMIT="$(git rev-parse "$TAG^{commit}")"
            TRIGGER="${{ github.event.workflow_run.head_sha }}"
            HEAD_COMMIT="$(git rev-parse HEAD)"
            if [ -n "$CREATED" ]; then
              if [ "$TAG_COMMIT" != "$TRIGGER" ] && ! git merge-base --is-ancestor "$TRIGGER" "$TAG_COMMIT"; then
                echo "Tag $TAG ($TAG_COMMIT) is not this Tag release cut ($TRIGGER); skipping."
                echo "skip=true" >> "$GITHUB_OUTPUT"
                exit 0
              fi
            elif [ "$TAG_COMMIT" != "$HEAD_COMMIT" ]; then
              echo "Tag $TAG ($TAG_COMMIT) is not this commit ($HEAD_COMMIT); skipping."
              echo "skip=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "skip=false" >> "$GITHUB_OUTPUT"

      - name: Verify tag matches package.json
        if: steps.resolve.outputs.skip != 'true'
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          TAG_VERSION="${{ steps.resolve.outputs.tag }}"
          TAG_VERSION="${TAG_VERSION#v}"
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "package.json version ($PKG_VERSION) does not match tag ($TAG_VERSION)"
            exit 1
          fi
          DESKTOP_VERSION=$(node -p "require('./apps/desktop/package.json').version")
          TAURI_VERSION=$(node -p "require('./apps/desktop/src-tauri/tauri.conf.json').version")
          CARGO_VERSION=$(awk '
            $0 == "[package]" { in_pkg = 1; next }
            in_pkg && /^\[/ { exit }
            in_pkg && $1 == "version" {
              gsub(/"/, "", $3)
              print $3
              exit
            }
          ' apps/desktop/src-tauri/Cargo.toml)
          if [ "$DESKTOP_VERSION" != "$TAG_VERSION" ] || [ "$TAURI_VERSION" != "$TAG_VERSION" ] || [ "$CARGO_VERSION" != "$TAG_VERSION" ]; then
            echo "Desktop version stamps (package=$DESKTOP_VERSION tauri=$TAURI_VERSION cargo=$CARGO_VERSION) do not match tag ($TAG_VERSION)"
            exit 1
          fi

      - name: Lint, typecheck, test, and build
        if: steps.resolve.outputs.skip != 'true'
        run: |
          bun run lint
          bun run typecheck
          bun run test:core
          bun run test:platforms
          bun run test:plugins
          bun run test:services
          bun run test:cli
          bun run test:docs
          bun run build

      - name: Set up Node for npm publish
        if: steps.resolve.outputs.skip != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org

      - name: Publish to npm
        if: steps.resolve.outputs.skip != 'true'
        run: |
          set -euo pipefail
          VERSION="${{ steps.resolve.outputs.tag }}"
          VERSION="${VERSION#v}"
          if npm view "harnesstap@${VERSION}" version >/dev/null 2>&1; then
            echo "harnesstap@${VERSION} already on npm; skipping publish."
            exit 0
          fi
          npm publish --access public

      - name: Create GitHub release
        if: steps.resolve.outputs.skip != 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.resolve.outputs.tag }}
          body_path: .changes/${{ steps.resolve.outputs.tag }}.md
          generate_release_notes: false

  # Native GitHub-hosted runners (no cross-compile). Tauri v2 filters
  # bundle.targets to the host OS, so each job only produces that platform's
  # installers. Builds are unsigned; see apps/desktop/README.md.
  desktop:
    name: desktop (${{ matrix.name }})
    needs: release
    if: needs.release.result == 'success' && needs.release.outputs.skip != 'true'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          # macos-latest is Apple Silicon (aarch64). macos-15-intel is the
          # current GitHub-hosted Intel image (last x86_64 macOS runner).
          - name: macos-aarch64
            runner: macos-latest
          - name: macos-x64
            runner: macos-15-intel
          - name: windows-x64
            runner: windows-latest
          - name: windows-arm64
            runner: windows-11-arm
          # Ubuntu 22.04 is Tauri v2's oldest WebKitGTK 4.1 image, so
          # AppImage/deb/rpm stay glibc-compatible with 22.04 / Debian 12.
          # ubuntu-22.04-arm is a standard GitHub-hosted runner.
          - name: linux-x64
            runner: ubuntu-22.04
          - name: linux-arm64
            runner: ubuntu-22.04-arm
    steps:
      # Tag/workflow_run: build the tagged commit. workflow_dispatch: build
      # this workflow revision so a backfill onto an older tag (e.g. v0.1.0)
      # can still produce Windows/Linux installers.
      - name: Check out sources
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.sha || needs.release.outputs.tag }}

      - name: Install Linux Tauri / WebKit deps
        if: startsWith(matrix.runner, 'ubuntu-')
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            libgtk-3-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            xdg-utils \
            rpm \
            squashfs-tools \
            libfuse2

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # macOS / Windows: one tauri build produces that OS's installers.
      - name: Build desktop app
        if: ${{ !startsWith(matrix.runner, 'ubuntu-') }}
        run: bun run desktop:build

      # Tauri's unsigned macOS bundle keeps a linker signature with
      # Sealed Resources=none. Gatekeeper then reports the quarantined app
      # as damaged. Ad-hoc reseal (--sign -) writes CodeResources; then
      # replace the DMG so the attached artifact contains the sealed app.
      - name: Reseal macOS app for Gatekeeper
        if: startsWith(matrix.name, 'macos-')
        env:
          RESEAL_REQUIRE: "1"
        run: bash apps/desktop/scripts/reseal-macos-app.sh

      # Linux: tauri.conf.json lists appimage before deb/rpm, and a single
      # `tauri build` stops at the first bundler failure. Keep the split so
      # a later AppImage-only failure is obvious and .deb/.rpm are already built.
      #
      # APPIMAGE_EXTRACT_AND_RUN / NO_STRIP stay set. They were already present
      # in run 33032582858 and are not the fix: linuxdeploy started, then the
      # GTK plugin ldd'd usr/bin/ht-agent (Bun --compile) and SIGABRTed.
      # squashfs-tools extracts linuxdeploy without FUSE; libfuse2 is extra
      # coverage on Ubuntu 22.04 (tauri-apps/tauri#5526).
      - name: Build Linux deb and rpm
        if: startsWith(matrix.runner, 'ubuntu-')
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
          NO_STRIP: "1"
        run: |
          set -euo pipefail
          bun run desktop:prepare-sidecar
          cd apps/desktop
          bun install
          bun run tauri -- build --bundles deb,rpm

      # Tauri only looks in ~/.cache/tauri for linuxdeploy-${ARCH}.AppImage
      # (and linuxdeploy-plugin-appimage.AppImage). Pre-extract both AppImages
      # with unsquashfs and install ELF stubs so they run without FUSE.
      # linuxdeploy-wrap.sh shelters usr/bin/ht-agent by sidecar name (Release
      # #7: system ldd exited 0 on the Bun --compile ELF, so ldd-based shelter
      # never ran; gtk upstream.sh:296 then SIGABRTed). The GTK wrapper also
      # name-shelters before invoking upstream. Nested LINUXDEPLOY_WRAP_ACTIVE
      # exec must not restore the sidecar before gtk finishes.
      - name: Seed linuxdeploy without FUSE
        if: startsWith(matrix.runner, 'ubuntu-')
        run: bash apps/desktop/scripts/seed-linuxdeploy.sh

      - name: Build Linux AppImage
        if: startsWith(matrix.runner, 'ubuntu-')
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
          NO_STRIP: "1"
        run: |
          set -euo pipefail
          cd apps/desktop
          bun run tauri -- bundle --verbose --bundles appimage
          shopt -s nullglob
          images=(src-tauri/target/release/bundle/appimage/*.AppImage)
          if [ "${#images[@]}" -eq 0 ]; then
            echo "AppImage bundling produced no .AppImage."
            find src-tauri/target/release/bundle -type f || true
            exit 1
          fi
          echo "AppImage bundle succeeded: ${images[*]}"

      - name: Attach installers to GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${{ needs.release.outputs.tag }}"
          BUNDLE="apps/desktop/src-tauri/target/release/bundle"
          shopt -s nullglob
          files=()
          for match in \
            "$BUNDLE"/dmg/*.dmg \
            "$BUNDLE"/nsis/*.exe \
            "$BUNDLE"/msi/*.msi \
            "$BUNDLE"/appimage/*.AppImage \
            "$BUNDLE"/deb/*.deb \
            "$BUNDLE"/rpm/*.rpm
          do
            if [ -f "$match" ]; then
              files+=("$match")
            fi
          done
          if [ "${#files[@]}" -eq 0 ]; then
            echo "No desktop installers produced for ${{ matrix.name }}."
            find "$BUNDLE" -type f || true
            exit 1
          fi
          if [[ "${{ matrix.name }}" == linux-* ]]; then
            has_deb_or_rpm=false
            has_appimage=false
            for f in "${files[@]}"; do
              case "$f" in
                *.deb|*.rpm) has_deb_or_rpm=true ;;
                *.AppImage) has_appimage=true ;;
              esac
            done
            if [ "$has_deb_or_rpm" != true ]; then
              echo "Linux job produced no .deb or .rpm for ${{ matrix.name }}."
              exit 1
            fi
            if [ "$has_appimage" != true ]; then
              echo "Linux job produced no .AppImage for ${{ matrix.name }}."
              find "$BUNDLE" -type f || true
              exit 1
            fi
          fi
          gh release upload "$TAG" "${files[@]}" --clobber --repo "${{ github.repository }}"
          echo "Uploaded ${files[*]} to $TAG"
