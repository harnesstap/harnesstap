name: desktop-e2e
on:
  workflow_dispatch:
    inputs:
      update_baselines:
        description: Write e2e/visual inside the pinned Playwright image
        type: boolean
        default: false
  schedule:
    - cron: "0 9 * * *"

jobs:
  e2e:
    if: github.event_name != 'workflow_dispatch' || github.event.inputs.update_baselines != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.9"
      - name: Install Linux Tauri / WebKit deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev webkit2gtk-driver librsvg2-dev patchelf \
            libssl-dev libgtk-3-dev libayatana-appindicator3-dev \
            build-essential curl wget file libxdo-dev git xvfb
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
      - name: Build + run E2E
        run: |
          bun install
          bun run desktop:e2e:build
          xvfb-run -a bun run desktop:e2e
      - name: Upload artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-e2e-artifacts
          path: apps/desktop/e2e/artifacts/

  visual:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Pinned Playwright image: Chromium + fonts match committed baselines (G8).
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
      options: --ipc=host
    steps:
      - uses: actions/checkout@v4
      - name: Git safe directory
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - uses: ./.github/actions/desktop-visual
        with:
          update-baselines: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.update_baselines == 'true' }}
      - name: Upload visual artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-visual-artifacts
          path: apps/desktop/e2e/artifacts/
          if-no-files-found: ignore
      - name: Upload container shots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-visual-container-shots
          path: apps/desktop/e2e/artifacts/shots/[0-9]*.png
          if-no-files-found: ignore
      - name: Upload refreshed baselines
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.update_baselines == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: desktop-visual-baselines
          path: apps/desktop/e2e/visual/*.png
