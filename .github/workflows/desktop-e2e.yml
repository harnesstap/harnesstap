name: desktop-e2e
on:
  workflow_dispatch:
  schedule:
    - cron: "0 9 * * *"

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.9"
      - name: Install Linux Tauri / WebKit deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev webkit2gtk-driver librsvg2-dev patchelf \
            libssl-dev libgtk-3-dev libayatana-appindicator3-dev \
            build-essential curl wget file libxdo-dev git xvfb
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
      - name: Build + run E2E
        run: |
          bun install
          bun run desktop:e2e:build
          xvfb-run -a bun run desktop:e2e
      - name: Upload artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-e2e-artifacts
          path: apps/desktop/e2e/artifacts/

  visual:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.9"
      - name: Install JS deps and Chromium
        run: |
          bun install
          cd apps/desktop && bun install
          cd apps/desktop && bunx playwright install --with-deps chromium
      - name: Start demo agent and Vite
        run: |
          HT_DEMO_ROOT=/tmp/htdemo HARNESSTAP_AGENT_PORT=7474 \
            bash apps/desktop/scripts/demo-home.sh &
          for i in $(seq 1 40); do
            curl -sf http://127.0.0.1:7474/v1/health && break
            sleep 1
          done
          curl -sf http://127.0.0.1:7474/v1/health
          cd apps/desktop && VITE_AGENT_URL=http://127.0.0.1:7474 \
            bunx vite --host 127.0.0.1 --port 5173 --strictPort &
          for i in $(seq 1 40); do
            curl -sf http://127.0.0.1:5173/ >/dev/null && break
            sleep 1
          done
          curl -sf http://127.0.0.1:5173/ >/dev/null
      - name: Shots, compare, axe, reduced motion, trace
        env:
          SHOTS_BASE_URL: http://127.0.0.1:5173/
          SHOTS_AGENT_PORT: "7474"
          SHOTS_TOKEN_PATH: /tmp/htdemo/home/.harnesstap/agent-token
          SHOTS_PROJECT_PATH: /tmp/htdemo/project
        run: bun run desktop:check
      - name: Upload visual artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-visual-artifacts
          path: apps/desktop/e2e/artifacts/
