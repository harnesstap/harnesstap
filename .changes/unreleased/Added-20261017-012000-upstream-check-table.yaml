kind: Added
body: '`ht plugin check` now also checks every upstream link (kept-in-sync and separate-copy profiles, and pulled catalog packages) for newer versions and stores the answer in a local table (schema v42, `upstream_checks`), so `ht status` and Desktop can read it without a network call. The newest version inside the link''s range is offered as an update; a newer major shows as `major` and is never installed automatically. Cloud being unreachable or a parent not being published is recorded, not a failure. "Not now" remembers the version it set aside, and a newer version shows up again. JSON output adds an `upstream` array.'
