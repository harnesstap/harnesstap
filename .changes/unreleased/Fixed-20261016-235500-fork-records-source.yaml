kind: Fixed
body: 'A fork now remembers what it was copied from. `ht plugin fork` and Desktop Fork store an upstream link: `{kind: "fork", ref, version_at_link}`. For a catalog source the ref is `org/catalog/slug@^x.y.z`. `ht plugin show` and the Library detail show "Forked from", and `--format json` and the API return `upstream`. Exporting or publishing a fork of a catalog plugin writes the link to `extensions["com.harnesstap"].upstream`, and installing such a package keeps it. The link survives `ht plugin cut`. This adds columns to the local database (schema v40), so older builds cannot open it.'
