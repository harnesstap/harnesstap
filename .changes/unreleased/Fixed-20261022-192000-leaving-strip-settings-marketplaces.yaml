kind: Fixed
body: Switching away from a profile removes the `extraKnownMarketplaces` entries HarnessTap added to Claude Code's settings.json also when the switch writes settings.json itself, for example because the profile manages `hooks`. Before, those entries stayed behind (such as `claude-plugins-official` after `ht profile use default`) and Claude Code cloned the marketplaces again. Entries you wrote, and those of marketplaces the new profile declares, stay.
