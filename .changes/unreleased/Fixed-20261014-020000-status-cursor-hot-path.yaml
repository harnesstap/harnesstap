kind: Fixed
body: Status reuses a full read until the profiles database, harness config, Cursor plugins, state.vscdb, or marketplace manifests change. File watchers mark that cache dirty, and a warm read is a lookup. When inputs change, the previous status is served with refreshing set while a new read runs. Apply, switch, and install drop the cache immediately. The newest Cursor Plugins log is read from the newest session folder, and state.vscdb is queried by key.
