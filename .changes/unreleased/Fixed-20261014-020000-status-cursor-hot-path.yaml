kind: Fixed
body: Status reuses a full read until the profiles database, harness config, Cursor plugin directories, or marketplace manifests change. It does not read Cursor's state.vscdb or logs folder. A plugin under ~/.cursor/plugins/cache counts as installed even when Cursor has it turned off, using the newest version directory, along with marketplaces/, local/ (including HarnessTap-managed copies), and plugin-* MCP folders. File watchers mark that cache dirty once per path, and a warm read is a lookup. When inputs change, the previous status is served with refreshing set while a new read runs on a background thread, so a warm read does not wait on that work. Plugin name lookups prepare their SQL once. Apply, switch, and install drop the cache immediately. Whether Cursor loads other harness trees is read from settings.json only, and defaults to on.
