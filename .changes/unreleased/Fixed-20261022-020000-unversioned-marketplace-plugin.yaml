kind: Fixed
body: 'A profile pinning a marketplace plugin to a version the marketplace has moved past now installs the commit that declared that version (or says which version is available) instead of caching the current copy under the pinned version, and an MCP-only plugin that declares no version, such as playwright@claude-plugins-official, no longer fails resource sync with "plugin tree is empty".'
