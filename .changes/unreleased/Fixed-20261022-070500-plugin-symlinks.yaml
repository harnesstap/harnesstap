kind: Fixed
body: 'Plugins that ship symlinks (such as `AGENTS.md -> CLAUDE.md` or a link to a folder) no longer abort `ht profile use`. Links are copied as links with their target unchanged, so a relative link keeps pointing at its sibling, links an earlier version made absolute are repaired, and cleanup never follows a link into another folder.'
