kind: Fixed
body: When `claude` is not on your PATH, a marketplace HarnessTap registers for Claude Code (for example `ecc` and `llm-council`) now names the same repository in `known_marketplaces.json` and in settings.json `extraKnownMarketplaces`. They used to differ, so Claude Code ignored the marketplace ("added but ignored") and listed its plugins as failed to load.
