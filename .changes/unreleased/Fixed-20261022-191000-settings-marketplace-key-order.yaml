kind: Fixed
body: Switching away from a profile now removes the `extraKnownMarketplaces` entries HarnessTap added to Claude Code's settings.json even after Claude Code rewrote the file with its own key order (for example after `claude plugin install`). Only the marketplace of a plugin you installed stays, so Claude Code no longer clones the other marketplaces (thousands of files) again.
