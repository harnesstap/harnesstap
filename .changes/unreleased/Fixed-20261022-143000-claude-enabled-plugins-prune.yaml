kind: Fixed
body: 'Switching profiles now takes the `enabledPlugins` entries HarnessTap added to an existing `~/.claude/settings.json` back out even when you have no `installed_plugins.json` of your own. Before, the entries stayed after the switch while `status --check` said everything was in sync. Your own `enabledPlugins` entries are left as they are.'
