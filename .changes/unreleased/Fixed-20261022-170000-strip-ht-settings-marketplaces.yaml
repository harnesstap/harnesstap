kind: Fixed
body: Switching away from a profile removes the `extraKnownMarketplaces` entries HarnessTap added to Claude Code's settings.json, so Claude Code no longer clones those marketplaces again on its next start. An entry you wrote or changed stays, a backup is kept, and `ht revert` puts the entries back.
