body: Fix CLI release blockers — stop double-prefixing `help scenario` commands, point empty-tree `scan` at `init` instead of `harness init`, exit 1 from `plugin diff` when the target plugin is missing, tell users to `plugin cut` a frozen version first when share/export hits unpublished plugin edits, honor global flags before profile root shorthand names, and warn on stderr when `auth orgs` runs while logged out while keeping JSON stdout as `[]`.
