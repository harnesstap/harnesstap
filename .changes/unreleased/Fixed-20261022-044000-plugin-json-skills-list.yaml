kind: Fixed
body: 'A plugin whose plugin.json lists its skills as an array of paths (such as `mattpocock-skills`, with skills nested under `skills/<group>/<skill>`) now has every listed skill imported and written to `.claude`, `.cursor` and `.agents` skills. As in Claude Code, a listed path adds to the plugin''s `skills/` folder instead of replacing it, and may be a skill or a folder of skills; paths outside the plugin are ignored.'
