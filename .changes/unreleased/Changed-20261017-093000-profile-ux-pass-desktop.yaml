kind: Changed
body: 'Desktop profile screens are leaner and use one noun, "profile". The Library detail and the profile page share one header: Edit, Duplicate, Tags and History as icons, then a 3-dot menu with Refresh from origin, Run Doctor, Publish, Detach and, last and in red, Delete; every icon has a tooltip and there is no always-visible trash. A profile''s Library detail no longer has its own Apply (the sidebar Apply is the one place to apply), and its type shows as a chip under the title. Duplicate is also on the profile page; the dialog is titled "Duplicate profile", checks the name as you type, and its toast opens the new profile. A kept-in-sync profile lists its parent''s items inline in Composition with a link icon; hidden ones stay in place, dimmed and struck through, with an eye-off icon, and a chip under the title says what it is synced with. The edit pane saves as you go (no Save or Discard); edits stay in the Library until you Apply. Detach happens at once and its toast offers Undo for 10 seconds, which puts back the link, the hidden list and the item order. "Edited" replaces the `*` after a version, and tooltips no longer linger after a dialog closes.'
