kind: Fixed
body: 'Claude Code marketplaces HarnessTap registers for a profile now have Claude Code auto-update turned off. When Claude Code still changes one (for example with `claude plugin marketplace update`) or a file in it, `ht profile status` lists it as kept, changed by Claude Code, instead of reporting the profile in sync or as unsaved changes, and apply or a profile switch keeps the entry with a warning instead of overwriting it or deleting the file it is in.'
