[package]
name = "harnesstap-desktop"
version = "0.1.0"
description = "HarnessTap desktop persona control plane"
authors = ["HarnessTap"]
edition = "2021"

[lib]
name = "harnesstap_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
